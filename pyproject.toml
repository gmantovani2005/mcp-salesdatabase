[project]
name = "mcp-salesdatabase"
version = "0.1.0"
description = "MCP de análise de vendas conectado a um PostgreSQL"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=1.2.0",
    "psycopg[binary,pool]>=3.2.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
